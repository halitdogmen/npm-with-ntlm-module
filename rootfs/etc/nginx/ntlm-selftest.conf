# Sadece imaj derlenirken "nginx -t -c" ile modülü doğrulamak için kullanılır.
# Çalışan NPM bu dosyayı okumaz.

load_module /usr/lib/nginx/modules/ngx_http_upstream_ntlm_module.so;

# 'npm' kullanicisi konteyner acilisinda olusturuluyor; build sirasinda
# henuz yok, bu yuzden burada root kullaniliyor (yalnizca 'nginx -t' icin).
user                  root;
pid                   /tmp/ntlm-selftest.pid;
error_log             stderr warn;
worker_processes      1;

events {
	worker_connections 64;
}

http {
	access_log            off;
	client_body_temp_path /tmp/ntlm-selftest-body;
	proxy_temp_path       /tmp/ntlm-selftest-proxy;
	fastcgi_temp_path     /tmp/ntlm-selftest-fastcgi;
	uwsgi_temp_path       /tmp/ntlm-selftest-uwsgi;
	scgi_temp_path        /tmp/ntlm-selftest-scgi;

	upstream ntlm_selftest_backend {
		server 127.0.0.1:65000;
		ntlm 32;
		ntlm_timeout 60s;
	}

	server {
		listen 127.0.0.1:65001;

		location / {
			proxy_pass http://ntlm_selftest_backend;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
		}
	}
}
