# ============================================================================
# /data/nginx/custom/http_top.conf
# ============================================================================
# NPM bu dosyayı http { } bloğunun en başında include eder; upstream
# tanımları buraya yazılır. Dosyayı NPM'in data volume'una koyun:
#   ./data/nginx/custom/http_top.conf
# Sonra: docker compose restart  (veya NPM arayüzünden bir host kaydedin)
# ============================================================================

# --- Örnek 1: düz HTTP backend (IIS / Exchange / SharePoint / DevOps) -------
upstream ntlm_intranet {
    server 192.168.1.50:80;

    # NTLM bağlantı sabitleme: kimlik doğrulaması yapılmış TCP bağlantısı
    # istemciye "pin"lenir. Parametre = önbellekte tutulacak azami bağlantı.
    ntlm 100;

    # Boşta kalan pinlenmiş bağlantının kapatılma süresi
    ntlm_timeout 60s;
}

