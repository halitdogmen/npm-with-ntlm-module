# ============================================================================
# Proxy Host > Advanced sekmesine yapıştırılacak içerik (HTTP backend)
# ============================================================================
# Advanced alanında "location /" bulunduğunda NPM kendi varsayılan
# location bloğunu üretmez; proxy_pass'i biz veriyoruz.
#
# Proxy Host'un "Forward Hostname / IP" ve "Port" alanları bu durumda
# kullanılmaz ama zorunlu oldukları için upstream ile aynı değeri yazın.
# ============================================================================

location / {
    proxy_pass http://ntlm_intranet$request_uri;

    # NTLM zorunlulukları: kalıcı (keepalive) HTTP/1.1 bağlantısı
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;

    # Windows kimlik doğrulaması büyük başlıklar üretir
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # NTLM el sıkışması sırasında 401 yanıtları istemciye aynen gitmeli
    proxy_intercept_errors off;
}
