# ============================================================================
# Proxy Host > Advanced (Exchange / OWA / EWS, HTTPS backend)
# ============================================================================
# Bu örnek http_top.conf içindeki "ntlm_exchange" upstream'ini kullanır.
# ============================================================================

location / {
    proxy_pass https://ntlm_exchange$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;

    # Backend sertifikası self-signed ise:
    proxy_ssl_verify       off;
    proxy_ssl_server_name  on;
    proxy_ssl_session_reuse off;

    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # OWA/EWS uzun süreli istekler (RPC over HTTP, MAPI, EWS streaming)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_request_buffering off;
    proxy_intercept_errors  off;

    client_max_body_size 0;
}
