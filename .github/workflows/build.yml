name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "examples/**"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      npm_version:
        description: "jc21/nginx-proxy-manager sürümü (boş = NPM_VERSION dosyası)"
        required: false
        default: ""
      arm64:
        description: "linux/arm64 de derlensin mi?"
        type: boolean
        required: false
        default: true
  schedule:
    # Temel imajdaki güvenlik güncellemelerini almak için haftalık yeniden derleme
    - cron: "0 4 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.cfg.outputs.npm_version }}
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm ve platform matrisini belirle
        id: cfg
        run: |
          VERSION="${{ github.event.inputs.npm_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(tr -d ' \n\r' < NPM_VERSION)"
          fi
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jc21/nginx-proxy-manager:$VERSION üzerine derlenecek"

          ARM64="${{ github.event.inputs.arm64 }}"
          if [ "$ARM64" = "false" ]; then
            MATRIX='[{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"}]'
          else
            MATRIX='[{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","suffix":"arm64"}]'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Temel imaj etiketi gerçekten var mı?
        run: |
          VERSION="${{ steps.cfg.outputs.npm_version }}"
          if ! curl -fsSL "https://hub.docker.com/v2/repositories/jc21/nginx-proxy-manager/tags/${VERSION}" >/dev/null; then
            echo "::error::jc21/nginx-proxy-manager:${VERSION} Docker Hub'da bulunamadı"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.cfg.runner }}
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girişi
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derle ve digest olarak push et
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.cfg.platform }}
          push: true
          provenance: false
          build-args: |
            NPM_VERSION=${{ needs.prepare.outputs.npm_version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cfg.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cfg.suffix }}

      - name: Digest'i kaydet
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cfg.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girişi
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.npm_version }}
            type=raw,value=${{ needs.prepare.outputs.npm_version }}-ntlm
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Manifest listesini oluştur ve push et
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Sonucu doğrula
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.npm_version }}"

      - name: Duman testi (modül yükleniyor mu?)
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.npm_version }}"
          docker run --rm --entrypoint sh "$IMG" -c 'nginx -t -c /etc/nginx/ntlm-selftest.conf && cat /usr/share/nginx-ntlm/ntlm-build-info.txt'
